<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">FinanceResearchAgent LangGraph runtime workflow</title>
  <desc id="desc">The FinanceResearchAgent LangGraph workflow generates a query, researches the web, summarizes sources, reflects on knowledge gaps, loops for more research, and finalizes a cited report.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#102a43"/>
      <stop offset="1" stop-color="#164e63"/>
    </linearGradient>
    <linearGradient id="node" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5fbff"/>
      <stop offset="1" stop-color="#d9f0ee"/>
    </linearGradient>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#f5b942"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#061a2a" flood-opacity=".3"/>
    </filter>
    <style>
      .label { font: 600 24px 'Segoe UI', sans-serif; fill: #102a43; text-anchor: middle; }
      .detail { font: 400 16px 'Segoe UI', sans-serif; fill: #486581; text-anchor: middle; }
      .edge { fill: none; stroke: #f5b942; stroke-width: 4; marker-end: url(#arrow); }
      .edge-label { font: 600 16px 'Segoe UI', sans-serif; fill: #f8fafc; }
    </style>
  </defs>
  <rect width="1400" height="760" rx="28" fill="url(#bg)"/>
  <text x="70" y="76" fill="#f8fafc" font-family="Segoe UI, sans-serif" font-size="34" font-weight="700">FinanceResearchAgent</text>
  <text x="70" y="112" fill="#b8d8e5" font-family="Segoe UI, sans-serif" font-size="19">LangGraph runtime workflow</text>

  <path class="edge" d="M165 330 H220"/>
  <path class="edge" d="M430 330 H485"/>
  <path class="edge" d="M695 330 H750"/>
  <path class="edge" d="M960 330 H1015"/>
  <path class="edge" d="M1120 405 C1120 625 665 680 590 430"/>
  <path class="edge" d="M1225 330 H1290"/>
  <text class="edge-label" x="895" y="625">continue research</text>
  <text class="edge-label" x="1145" y="300">finalize</text>

  <g filter="url(#shadow)">
    <rect x="65" y="285" width="100" height="90" rx="18" fill="#f5b942"/>
    <text x="115" y="338" class="label">START</text>

    <rect x="220" y="270" width="210" height="120" rx="20" fill="url(#node)"/>
    <text x="325" y="320" class="label">generate_query</text>
    <text x="325" y="350" class="detail">LLM query generation</text>

    <rect x="485" y="270" width="210" height="120" rx="20" fill="url(#node)"/>
    <text x="590" y="320" class="label">web_research</text>
    <text x="590" y="350" class="detail">search and sources</text>

    <rect x="750" y="270" width="210" height="120" rx="20" fill="url(#node)"/>
    <text x="855" y="320" class="label">summarize_sources</text>
    <text x="855" y="350" class="detail">running summary</text>

    <rect x="1015" y="270" width="210" height="120" rx="20" fill="url(#node)"/>
    <text x="1120" y="320" class="label">reflect_on_summary</text>
    <text x="1120" y="350" class="detail">find knowledge gaps</text>

    <rect x="1290" y="285" width="75" height="90" rx="18" fill="#f5b942"/>
    <text x="1327" y="338" class="label" font-size="17">END</text>

    <rect x="760" y="590" width="260" height="100" rx="20" fill="#f5b942"/>
    <text x="890" y="635" class="label">finalize_summary</text>
    <text x="890" y="663" class="detail">cited report output</text>
  </g>
  <text x="70" y="720" fill="#b8d8e5" font-family="Segoe UI, sans-serif" font-size="17">Conditional routing: reflect_on_summary loops until the configured research limit, then finalizes.</text>
</svg>